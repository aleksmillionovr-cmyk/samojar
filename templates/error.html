{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="card empty"><h1 style="justify-content:center">{{ code }} · {{ title }}</h1><p>{{ text }}</p><a class="btn sec" href="/">На главную</a></div>{% endblock %}
{% block bare %}<div class="login-wrap"><div class="card login" style="text-align:center"><h1 style="justify-content:center">{{ code }} · {{ title }}</h1><p class="muted">{{ text }}</p><a class="btn" href="/login">Войти</a></div></div>{% endblock %}
